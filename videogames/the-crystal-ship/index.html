<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070f13" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="The Crystal Ship — Chapter I: Black Tide. A first-person horror game aboard the ocean liner Orpheus."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./assets/favicon.svg" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>The Crystal Ship</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="color: #d8cfb4; font-family: system-ui, sans-serif; padding: 2rem">
        The Crystal Ship requires JavaScript. · The Crystal Ship richiede JavaScript.
      </p>
    </noscript>
    <!-- A classic script, not a module: ES modules are blocked by the browser
         when a page is opened straight from disk, and this game is meant to run
         from a double-clicked index.html as well as from a web server. -->
    <script>
      // The web-app manifest can only be fetched over http(s). Opened straight
      // from disk the browser refuses it and logs a CORS error, so attach it
      // only when the game is actually being served.
      if (location.protocol !== "file:") {
        var manifest = document.createElement("link");
        manifest.rel = "manifest";
        manifest.href = "./manifest.webmanifest";
        document.head.appendChild(manifest);
      }
    </script>
    <script src="./js/game.js"></script>
  </body>
</html>
