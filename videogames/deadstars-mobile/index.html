<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#102815" />
    <title>DeadStars — Smartphone Edition</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: #07100a; color: #eaffd6; font: 700 16px system-ui, sans-serif; }
      body { display: grid; place-items: center; text-align: center; }
      a { color: #bcff3c; }
    </style>
    <script>
      (() => {
        const suffix = (matchMedia("(pointer: coarse)").matches || innerWidth < 900) ? "?mobile=1" : "";
        location.replace(`../deadstars/${suffix}`);
      })();
    </script>
  </head>
  <body>
    <p>Apertura di DeadStars Smartphone…<br /><a href="../deadstars/?mobile=1">Tocca qui se il gioco non parte.</a></p>
  </body>
</html>
