<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Bertranda 2 — mobile layout QA</title>
<style>
  body{margin:18px;background:#101817;color:#dcfff1;font:14px system-ui}
  button{margin:0 8px 12px 0;padding:10px;background:#234236;color:#fff;border:1px solid #67ff9a;border-radius:5px;cursor:pointer}
  iframe{display:block;border:2px solid #67ff9a;background:#06110f}
  p{max-width:850px;line-height:1.5}
</style>
<h1>Bertranda 2 · mobile layout QA</h1>
<p>Touch UI simulation inside a desktop browser. This checks layout and rotation, not real-device GPU performance. Fullscreen is intentionally unavailable in this test frame.</p>
<nav aria-label="Test viewport">
  <button data-width="844" data-height="390">Landscape 844 × 390</button>
  <button data-width="667" data-height="375">Small landscape 667 × 375</button>
  <button data-width="390" data-height="844">Portrait 390 × 844</button>
  <button data-width="568" data-height="320">Compact landscape 568 × 320</button>
  <button data-width="568" data-height="250">Browser bars 568 × 250</button>
  <button data-width="1280" data-height="720">Desktop 1280 × 720</button>
  <button id="layout-button">HUD + map preview (no 3D)</button>
  <button id="input-button">Canvas + real controls (no WebGL)</button>
</nav>
<iframe id="preview" title="Bertranda 2 touch preview" width="844" height="390" allow="fullscreen 'none'"></iframe>
<p id="status" role="status">Loading the real game source…</p>
<script>
  const preview = document.getElementById('preview');
  let gameHTML = '';
  let layoutOnly = false;
  let inputPreview = false;
  function showPreview() {
    const setup = '<base href="' + new URL('../', location.href).href + '">' +
      '<script>Object.defineProperty(navigator,"maxTouchPoints",{get:()=>5});<\/script>';
    let html = gameHTML.replace('<head>', '<head>' + setup)
      .replace(/<script src="\.\.\/game-counter[^>]*><\/script>/, '');
    if (layoutOnly) html = html.replace(/<script src="game\.js[^>]*><\/script>/, '<script src="tests/layout-preview.js?v=6-mobile-fix"><\/script>');
    if (inputPreview) html = html.replace(/<script src="game\.js/, '<script src="tests/canvas-preview.js?v=6-mobile-fix"><\/script><script src="game.js');
    preview.srcdoc = html;
    document.getElementById('status').textContent = inputPreview ? 'Production game logic and DOM controls; a 2D calibration canvas replaces WebGL. Start in portrait, rotate, drag to turn, hold FIRE and release. This does not test GPU rendering.' : layoutOnly ? 'Layout only: production CSS and 2D map, no 3D combat or FPS measurement.' : 'Ready. Start, rotate, fire, reload, toggle light, pause and resume.';
  }
  document.getElementById('layout-button').addEventListener('click', () => {
    if (!gameHTML) return;
    layoutOnly = !layoutOnly;
    inputPreview = false;
    showPreview();
  });
  document.getElementById('input-button').addEventListener('click', () => {
    if (!gameHTML) return;
    inputPreview = !inputPreview;
    layoutOnly = false;
    showPreview();
  });
  document.querySelector('nav').addEventListener('click', event => {
    const button = event.target.closest('button[data-width]');
    if (!button) return;
    preview.width = button.dataset.width;
    preview.height = button.dataset.height;
    document.getElementById('status').textContent = 'Viewport ' + preview.width + ' × ' + preview.height + ' — existing session preserved';
  });
  fetch('../index.html?v=6-mobile-fix', { cache: 'no-store' }).then(response => {
    if (!response.ok) throw Error('Game source unavailable');
    return response.text();
  }).then(html => {
    gameHTML = html;
    showPreview();
  }).catch(error => { document.getElementById('status').textContent = error.message; });
</script>
</html>
