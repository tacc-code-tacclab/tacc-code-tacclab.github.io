name: Build lunar simulator assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-lunar-assets.yml"
      - "simulations/lunar-flight/fetch_and_process.py"

permissions:
  contents: write

concurrency:
  group: lunar-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: simulations/lunar-flight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy requests Pillow
      - name: Complete incomplete TLS chains of data hosts (verification stays on)
        run: |
          ca="$RUNNER_TEMP/ca.pem"; cp "$(python -m certifi)" "$ca"
          for h in $(python fetch_and_process.py --list-sources | sed -nE 's#^https://([^/]+)/.*#\1#p' | sort -u); do
            if echo | openssl s_client -connect "$h:443" -servername "$h" -CAfile "$ca" -verify_return_error >/dev/null 2>&1; then
              echo "$h: chain OK"; continue
            fi
            echo | openssl s_client -connect "$h:443" -servername "$h" 2>/dev/null | openssl x509 > "$RUNNER_TEMP/leaf.pem"
            url=$(openssl x509 -in "$RUNNER_TEMP/leaf.pem" -noout -ext authorityInfoAccess | sed -n 's/.*CA Issuers - URI://p' | head -1)
            echo "$h: missing intermediate, fetching $url"
            curl -sfL "$url" -o "$RUNNER_TEMP/issuer.crt"
            openssl x509 -inform DER -in "$RUNNER_TEMP/issuer.crt" >> "$ca" 2>/dev/null || openssl x509 -in "$RUNNER_TEMP/issuer.crt" >> "$ca"
            echo | openssl s_client -connect "$h:443" -servername "$h" -CAfile "$ca" -verify_return_error >/dev/null 2>&1 \
              && echo "$h: chain now verifies" || { echo "::error::$h: TLS chain still does not verify"; exit 1; }
          done
          echo "REQUESTS_CA_BUNDLE=$ca" >> "$GITHUB_ENV"
      - name: Offline pipeline self-test
        run: python tests/run_tests.py && rm -rf tests/_work
      - name: Download and process real LRO data (Apollo 11 site)
        run: |
          set -o pipefail
          python -u fetch_and_process.py --site apollo11 --cache "$RUNNER_TEMP/lro-cache" 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            msg=$(tail -n 40 "$RUNNER_TEMP/build.log" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=LRO build failed::$msg"
            exit 1
          }
      - name: Check GitHub size limits
        run: |
          du -sh assets
          big=$(find assets -type f -size +95M)
          if [ -n "$big" ]; then echo "Files too large for GitHub: $big"; exit 1; fi
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Build lunar simulator assets from NASA LRO data"
          git pull --rebase origin main
          git push
