name: Build lunar simulator assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-lunar-assets.yml"
      - "simulations/lunar-flight/fetch_and_process.py"

permissions:
  contents: write

concurrency:
  group: lunar-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: simulations/lunar-flight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy requests Pillow
      - name: Offline pipeline self-test
        run: python tests/run_tests.py && rm -rf tests/_work
      - name: Download and process real LRO data (Apollo 11 site)
        run: python fetch_and_process.py --site apollo11 --cache "$RUNNER_TEMP/lro-cache"
      - name: Check GitHub size limits
        run: |
          du -sh assets
          big=$(find assets -type f -size +95M)
          if [ -n "$big" ]; then echo "Files too large for GitHub: $big"; exit 1; fi
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Build lunar simulator assets from NASA LRO data"
          git pull --rebase origin main
          git push
