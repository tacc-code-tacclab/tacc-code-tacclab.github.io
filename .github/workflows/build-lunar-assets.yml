name: Build lunar simulator assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-lunar-assets.yml"
      - "simulations/lunar-flight/fetch_and_process.py"

permissions:
  contents: write

concurrency:
  group: lunar-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: simulations/lunar-flight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy requests Pillow
      - name: Complete incomplete TLS chains of data hosts (verification stays on)
        run: |
          ca="$RUNNER_TEMP/ca.pem"; cp "$(python -m certifi)" "$ca"
          ok() { echo | openssl s_client -connect "$1:443" -servername "$1" -CAfile "$ca" -verify_return_error >/dev/null 2>&1; }
          for h in $(python fetch_and_process.py --list-sources | sed -nE 's#^https://([^/]+)/.*#\1#p' | sort -u); do
            if ok "$h"; then echo "$h: chain OK"; continue; fi
            echo | openssl s_client -connect "$h:443" -servername "$h" 2>/dev/null | openssl x509 > "$RUNNER_TEMP/cur.pem"
            for depth in 1 2 3 4; do
              subj=$(openssl x509 -in "$RUNNER_TEMP/cur.pem" -noout -subject)
              iss=$(openssl x509 -in "$RUNNER_TEMP/cur.pem" -noout -issuer)
              url=$(openssl x509 -in "$RUNNER_TEMP/cur.pem" -noout -ext authorityInfoAccess 2>/dev/null | sed -n 's/.*CA Issuers - URI://p' | head -1)
              echo "::warning::$h depth $depth | $subj | $iss | AIA=$url"
              [ -n "$url" ] || break
              curl -sfL "$url" -o "$RUNNER_TEMP/issuer.bin" || { echo "::warning::download failed $url"; break; }
              if head -c 11 "$RUNNER_TEMP/issuer.bin" | grep -q -- '-----BEGIN'; then
                openssl x509 -in "$RUNNER_TEMP/issuer.bin" > "$RUNNER_TEMP/cur.pem"
              elif openssl x509 -inform DER -in "$RUNNER_TEMP/issuer.bin" > "$RUNNER_TEMP/cur.pem" 2>/dev/null; then :
              else openssl pkcs7 -inform DER -in "$RUNNER_TEMP/issuer.bin" -print_certs | openssl x509 > "$RUNNER_TEMP/cur.pem"
              fi
              cat "$RUNNER_TEMP/cur.pem" >> "$ca"
              if ok "$h"; then echo "$h: chain now verifies (depth $depth)"; break; fi
            done
            if ! ok "$h"; then
              err=$(echo | openssl s_client -connect "$h:443" -servername "$h" -CAfile "$ca" 2>&1 | grep -E "verify error|Verify return" | tr '\n' ' ')
              echo "::error::$h: TLS chain still does not verify: $err"; exit 1
            fi
          done
          echo "REQUESTS_CA_BUNDLE=$ca" >> "$GITHUB_ENV"
      - name: Offline pipeline self-test
        run: python tests/run_tests.py && rm -rf tests/_work
      - name: Download and process real LRO data (Apollo 11 site)
        run: |
          set -o pipefail
          python -u fetch_and_process.py --site apollo11 --cache "$RUNNER_TEMP/lro-cache" 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            msg=$(tail -n 40 "$RUNNER_TEMP/build.log" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=LRO build failed::$msg"
            exit 1
          }
      - name: Report feature names (IAU / USGS gazetteer)
        run: |
          python - <<'PY'
          import json
          j = json.load(open("assets/nomenclature.json", encoding="utf-8"))
          print("::notice::names " + json.dumps(j["counts"]) + " table_date=" + j["source"]["table_date"] + " types=" + str(len(j["feature_types"])))
          want = ["Copernicus", "Tycho", "Statio Tranquillitatis", "West", "Mare Tranquillitatis", "Tsiolkovskiy", "Mare Crisium", "Aldrin"]
          for f in j["features"]:
              if f[0] in want:
                  print("::notice::" + json.dumps(f, ensure_ascii=False))
          PY
      - name: Check GitHub size limits
        run: |
          du -sh assets
          big=$(find assets -type f -size +95M)
          if [ -n "$big" ]; then echo "Files too large for GitHub: $big"; exit 1; fi
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Build lunar simulator assets from NASA LRO data"
          git pull --rebase origin main
          git push
