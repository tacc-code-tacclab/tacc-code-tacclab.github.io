name: Probe LROC paths (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-lroc.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://pds.lroc.im-ldi.com/data/LRO-L-LROC-5-RDR-V1.0
          for u in "$B/" "$B/LROLRC_2001/DATA/SDP/" "$B/LROLRC_2001/DATA/SDP/NAC_DTM/" "$B/LROLRC_2001/DATA/SDP/NAC_DTM/APOLLO11/" "$B/LROLRC_2001/DATA/SDP/NAC_DTM/APOLLO_11/"; do
            code=$(curl -s -o /tmp/p.html -w '%{http_code}' "$u")
            names=$(grep -oE 'href="[^"?]+"' /tmp/p.html | sed 's/href="//;s/"$//' | grep -vE '^(/|\.\.|http)' | tr '\n' ' ' | cut -c1-3000)
            echo "::warning::$code $u => $names"
          done
          for u in "$B/LROLRC_2001/DATA/SDP/NAC_DTM/" "$B/"; do
            curl -s "$u" | grep -oiE 'href="[^"]*(apollo|a11|tranq)[^"]*"' | head -20 | tr '\n' ' ' | sed "s#^#::warning::match in $u => #"; echo
          done
