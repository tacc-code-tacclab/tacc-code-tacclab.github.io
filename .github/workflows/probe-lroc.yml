name: Probe LROC paths (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-lroc.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://pds.mcp.nasa.gov/data/store/img/
          P=lunar_reconnaissance_orbiter/pds4/lroc/lro-l-lroc-5-rdr/LROLRC_2001/DATA/SDP/NAC_DTM/
          for q in "list-type=2&delimiter=/&prefix=$P" "list-type=2&prefix=${P}APOLLO" "delimiter=/&prefix=$P"; do
            code=$(curl -sL -o /tmp/p -w '%{http_code}' "$B?$q")
            keys=$(grep -oE '<(Key|Prefix)>[^<]+' /tmp/p | sed 's/<[A-Za-z]*>//' | sed "s#^$P##" | tr '\n' ' ' | cut -c1-3500)
            [ -n "$keys" ] || keys=$(head -c 600 /tmp/p | tr '\r\n' '  ')
            echo "::warning::$code $q => $keys"
          done
