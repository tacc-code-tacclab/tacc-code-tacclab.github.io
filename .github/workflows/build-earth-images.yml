name: Build Lunar Rover data (Earth images, NASA GIBS)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-earth-images.yml"
      - "simulations/lunar-rover/tools/fetch_earth.py"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python simulations/lunar-rover/tools/fetch_earth.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simulations/lunar-rover/data/earth*.jpg simulations/lunar-rover/data/earth.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Lunar Rover: Earth images from NASA GIBS"
          git pull --rebase origin main
          git push
