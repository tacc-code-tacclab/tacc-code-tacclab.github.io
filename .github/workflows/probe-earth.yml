name: Probe NASA GIBS (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-earth.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          W="https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi"
          code=$(curl -sL -m 120 -o /tmp/cap.xml -w '%{http_code} %{size_download}' "$W?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0")
          echo "::warning::capabilities $code; layers: $(grep -o '<Name>[^<]*' /tmp/cap.xml | sed 's/<Name>//' | grep -iE 'bluemarble|weld|landsat|HLS|ASTER_GDEM_Color|SRTM_Color' | tr '\n' ' ' | cut -c1-2500)"
          try() { # name layer bbox(minlat,minlon,maxlat,maxlon) w h extra
            r=$(curl -sL -m 180 -o "/tmp/$1.jpg" -w '%{http_code} %{content_type} %{size_download}' "$W?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=$2&STYLES=&FORMAT=image/jpeg&CRS=EPSG:4326&BBOX=$3&WIDTH=$4&HEIGHT=$5$6")
            echo "::warning::$1 [$2 ${4}x${5}] => $r $(head -c 300 "/tmp/$1.jpg" | tr -cd '[:print:]' | cut -c1-160)"
          }
          try globe BlueMarble_ShadedRelief_Bathymetry "-90,-180,90,180" 2048 1024 ""
          try florida BlueMarble_ShadedRelief_Bathymetry "24,-88,31.5,-78" 2000 1500 ""
          try cape_weld Landsat_WELD_CorrectedReflectance_TrueColor_Global_Annual "28.2,-80.95,28.8,-80.35" 1024 1024 "&TIME=2000-12-01"
          try cape_hls HLS_L30_Nadir_BRDF_Adjusted_Reflectance "28.2,-80.95,28.8,-80.35" 1024 1024 "&TIME=2024-03-20"
          try cape_modis MODIS_Terra_CorrectedReflectance_TrueColor "28.2,-80.95,28.8,-80.35" 1024 1024 "&TIME=2024-03-20"
          python3 - <<'PY'
          import os
          for n in ("globe","florida","cape_weld","cape_hls","cape_modis"):
              p=f"/tmp/{n}.jpg"
              try:
                  from PIL import Image
              except Exception:
                  os.system("pip -q install pillow >/dev/null 2>&1")
                  from PIL import Image
              try:
                  im=Image.open(p).convert("RGB"); px=list(im.resize((8,8)).getdata()); mean=[sum(c[i] for c in px)//64 for i in range(3)]
                  ex=im.getextrema()
                  print(f"::warning::{n}: {im.size} mean rgb {mean} extrema {ex}")
              except Exception as e:
                  print(f"::warning::{n}: not an image ({e})")
          PY
