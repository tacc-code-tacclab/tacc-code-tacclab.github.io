name: Probe Lunar Prospector GRS (temporary)
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-lp.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://pds-geosciences.wustl.edu/lunar/lp-l-grs-5-elem-abundance-v1/lp_9001/data
          for f in "" lpgrs_high1_elem_abundance_5deg.tab lpgrs_high1_elem_abundance_5deg.lbl lpgrs_high1_elem_abundance_2deg.tab lpgrs_high1_elem_abundance_2deg.lbl; do
            code=$(curl -sL -m 60 -o /tmp/f -w '%{http_code} %{size_download}' "$B/$f")
            echo "::warning::$code $B/$f"
            if [ -n "$f" ]; then
              case "$f" in
                *.tab) echo "::warning::HEAD $f: $(head -n 3 /tmp/f | cut -c1-600 | tr '\n' '|') LINES $(wc -l < /tmp/f)";;
                *.lbl) echo "::warning::LBL $f: $(grep -iE 'NAME|UNIT|START_BYTE|BYTES |ROWS|DESCRIPTION' /tmp/f | tr -s ' ' | cut -c1-90 | tr '\r\n' ' |' | cut -c1-3800)";;
              esac
            else echo "::warning::DIR: $(grep -oiE 'href="[^"]+"' /tmp/f | tr '\n' ' ' | cut -c1-1500)"; fi
          done
