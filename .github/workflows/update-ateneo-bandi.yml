name: Update Ateneo Bandi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-ateneo-bandi.yml"
      - "services/ateneo-bandi/scripts/**"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: ateneo-bandi-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ateneo-bandi/scripts/requirements.txt
      - name: Install crawler dependencies
        run: python -m pip install --disable-pip-version-check -r services/ateneo-bandi/scripts/requirements.txt
      - name: Refresh reference catalogs monthly
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            python services/ateneo-bandi/scripts/build_catalogs.py
          fi
      - name: Test source parsers
        run: python -m unittest discover -s services/ateneo-bandi/tests -p 'test_*.py'
      - name: Build official-call index
        run: python services/ateneo-bandi/scripts/fetch_mur.py
      - name: Validate browser filters
        run: node services/ateneo-bandi/tests/app.test.cjs
      - name: Commit changed data
        run: |
          if git diff --quiet -- services/ateneo-bandi/data/; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/ateneo-bandi/data/
          git commit -m "Update Ateneo Bandi official data"
          git push
